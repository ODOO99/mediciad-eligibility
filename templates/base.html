<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Medicaid Eligibility{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    [x-cloak] { display: none !important; }
    .stage-pending   { @apply text-gray-400; }
    .stage-active    { @apply text-blue-600 font-semibold; }
    .stage-completed { @apply text-green-600; }
    .stage-failed    { @apply text-red-600; }
    .stage-skipped   { @apply text-gray-300 line-through; }
  </style>
</head>
<body class="h-full font-sans text-gray-800">

  <!-- Navbar -->
  <nav class="bg-blue-800 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <a href="{% url 'imports:index' %}" class="text-xl font-bold tracking-tight flex items-center gap-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          Medicaid Eligibility
        </a>
        <div class="flex items-center gap-4 text-sm">
          <a href="{% url 'imports:index' %}"
             class="text-blue-200 hover:text-white transition-colors {% block nav_import %}{% endblock %}">
            Batch Import
          </a>
          <a href="{% url 'patients:lookup' %}"
             class="text-blue-200 hover:text-white transition-colors {% block nav_lookup %}{% endblock %}">
            Single Lookup
          </a>
          <a href="{% url 'patients:list' %}"
             class="text-blue-200 hover:text-white transition-colors {% block nav_patients %}{% endblock %}">
            Patients
          </a>
          <a href="{% url 'eligibility:history' %}"
             class="text-blue-200 hover:text-white transition-colors {% block nav_history %}{% endblock %}">
            Eligibility History
          </a>
        </div>
      </div>
      <a href="{% url 'imports:settings' %}" title="Settings"
         class="text-blue-300 hover:text-white transition-colors {% block nav_settings %}{% endblock %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </a>
    </div>
  </nav>

  <!-- Flash messages -->
  {% if messages %}
  <div class="max-w-7xl mx-auto px-4 pt-4">
    {% for message in messages %}
    <div class="mb-2 p-3 rounded text-sm
      {% if message.tags == 'error' %}bg-red-100 text-red-800 border border-red-200
      {% elif message.tags == 'success' %}bg-green-100 text-green-800 border border-green-200
      {% else %}bg-blue-100 text-blue-800 border border-blue-200{% endif %}">
      {{ message }}
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- Page content -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  {% block modals %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
